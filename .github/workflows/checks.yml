name: Checks

on:
  push:
  pull_request:

jobs:
  checks:
    # Blocky is a Windows app: the hosts path, the admin check and the Tk window tests need Windows.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Lint
        run: python -m ruff check .

      - name: Format
        run: python -m ruff format --check .

      - name: Type check
        run: python -m mypy

      # Diagnostic branch only: 20 runs of test_p1.py to catch the intermittent startup-test failure;
      # error lines become annotations, which can be read without logging in.
      - name: Python tests
        shell: pwsh
        run: |
          $failed = 0
          foreach ($run in 1..20) {
            python -m pytest -q -p no:cacheprovider tests/test_p1.py | Tee-Object -Variable output
            if ($LASTEXITCODE -ne 0) {
              $failed++
              $output | Where-Object { $_ -match '^(E |FAILED)' } | ForEach-Object { Write-Output "::error title=run $run::$_" }
            }
          }
          Write-Output "$failed of 20 runs failed"
          if ($failed) { exit 1 }

      - name: Extension tests
        run: node --test "extension/*.test.js"
