name: Checks

on:
  push:
  pull_request:

jobs:
  checks:
    # Blocky is a Windows app: the hosts path, the admin check and the Tk window tests need Windows.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Lint
        run: python -m ruff check .

      - name: Format
        run: python -m ruff format --check .

      - name: Type check
        run: python -m mypy

      - name: Python tests
        run: python -m pytest

      - name: Extension tests
        run: node --test "extension/*.test.js"
