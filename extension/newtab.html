<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Blocky</title>
    <link rel="icon" href="icons/icon-32.png">
    <style>
      html { background: #273338; color: #F1F4EC; font-family: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box; }
      #message { width: min(560px, 100%); background: #2F3E44; border-radius: 16px; padding: 32px 40px; box-sizing: border-box; border-top: 6px solid #2B5748; color: #A9B5AD; margin: 0; }
      #message strong { display: block; color: #9CB080; font-size: 15px; letter-spacing: .04em; margin-bottom: 12px; }
    </style>
  </head>
  <body>
    <p id="message" hidden><strong>Blocky</strong>Blocky is not running. Start the app to see suggestions.</p>
    <script type="module" src="newtab.js"></script>
  </body>
</html>
